<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <!-- SEGURIDAD: el navegador solo acepta código de esta app y de Google (inicio de sesión), Leaflet (mapa) y OpenStreetMap -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client https://unpkg.com/leaflet@1.9.4/; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style https://unpkg.com/leaflet@1.9.4/; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://unpkg.com/leaflet@1.9.4/ https://*.googleusercontent.com; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c2447" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#081a33" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Mensajes de cobranza, datos de clientes, quejas y órdenes de campo de D@NDINET">
  <title>D@ndinet Mensajes</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32">
  <link rel="icon" href="icons/icono-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
  <script src="js/tema.js"></script>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/estilos.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <!-- INICIO DE SESIÓN -->
  <main id="login" class="login" hidden>
    <img src="icons/icono-192.png" alt="D@NDINET" width="96" height="96">
    <h1>D<span class="arroba">@</span>ndinet Mensajes</h1>
    <p>Avisos, clientes, quejas y órdenes de campo</p>
    <div id="btnGoogle" class="btn-google"></div>
    <p id="loginEstado" class="sub"></p>
    <p class="pie">Solo para usuarios autorizados.</p>
  </main>

  <!-- APLICACIÓN -->
  <div id="app" hidden>
    <a class="saltar" href="#vista">Saltar al contenido</a>
    <header class="cabecera">
      <div class="cabecera-in">
        <a href="#/" class="marca"><img src="icons/icono-192.png" alt="" width="32" height="32"> <span aria-label="D@ndinet Mensajes">D<span class="arroba">@</span>ndinet <small>Mensajes</small></span></a>
        <a href="#/cuenta" id="usuario" class="usuario" aria-label="Mi cuenta"></a>
      </div>
    </header>
    <div id="estado" class="estado" role="status" aria-live="polite"></div>
    <div id="actualizar" class="actualizar" hidden>Hay una versión nueva de la app. <button class="mini verde" id="btnActualizar">Actualizar</button></div>
    <main id="vista" class="vista" tabindex="-1"></main>
    <!-- la barra cambia según el rol (administrador / técnico): la arma js/app.js -->
    <nav class="inferior" aria-label="Navegación principal"></nav>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
